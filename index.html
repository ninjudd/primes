<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e12">
  <meta name="description" content="A quiet, moving portrait of the prime numbers. Each prime begins an orbit of its own.">
  <title>Prime Orbits</title>
  <link rel="canonical" href="https://ninjudd.com/primes/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Prime Orbits">
  <meta property="og:description" content="I make a nothing of my own. A moving portrait of the prime numbers.">
  <meta property="og:url" content="https://ninjudd.com/primes/">
  <meta property="og:image" content="https://ninjudd.com/primes/og-image-proportional.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Prime Orbits. I make a nothing of my own. Concentric teal rings with golden dots on a dark background.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Prime Orbits">
  <meta name="twitter:description" content="I make a nothing of my own. A moving portrait of the prime numbers.">
  <meta name="twitter:image" content="https://ninjudd.com/primes/og-image-proportional.png">
  <meta name="twitter:image:alt" content="Prime Orbits. I make a nothing of my own. Concentric teal rings with golden dots on a dark background.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23090e12' stroke='%238dbbb5'/%3E%3Ccircle cx='16' cy='4' r='3' fill='%23efd9a5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=number-set">
  <script type="module" src="app.js?v=number-set"></script>
</head>
<body>
  <main aria-label="Prime Orbits">
    <canvas role="img" aria-label="Concentric number orbits. Bright gold dots represent primes; optional dim dots represent non-primes. Each number begins at the top and moves clockwise with a period equal to its value."></canvas>
    <div class="number-set" role="radiogroup" aria-label="Numbers shown">
      <input id="primes-only" name="number-set" type="radio" checked aria-label="Prime numbers">
      <label for="primes-only" title="Prime numbers">ℙ</label>
      <input id="non-primes" name="number-set" type="radio" aria-label="All positive integers">
      <label for="non-primes" title="All positive integers">ℕ</label>
    </div>
    <div class="controls" role="group" aria-label="Animation controls">
      <button id="play" type="button" aria-label="Pause animation" title="Pause (Space)">
        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
      </button>
      <button id="reset" type="button" aria-label="Reset animation" title="Reset (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg>
      </button>
      <button id="share" type="button" aria-label="Share this moment" title="Share this moment">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 12v8h14v-8"/></svg>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="-2" max="4" step="0.25" value="0" aria-label="Animation speed">
      <output id="speed-value" for="speed">1×</output>
    </div>
    <div class="share-feedback">
      <span id="share-status" role="status" aria-live="polite"></span>
      <input id="share-link" aria-label="Link to this moment" readonly hidden>
    </div>
    <noscript>Enable JavaScript to watch the prime orbits.</noscript>
  </main>
</body>
</html>
