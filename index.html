<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e12">
  <meta name="description" content="A quiet, moving portrait of the prime numbers. Each prime begins an orbit of its own.">
  <title>Prime Orbits</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23090e12' stroke='%238dbbb5'/%3E%3Ccircle cx='16' cy='4' r='3' fill='%23efd9a5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main aria-label="Prime Orbits">
    <canvas role="img" aria-label="Concentric prime orbits. Each prime is born at the top and moves clockwise, completing a revolution every p units of time. Larger primes form the outer rings."></canvas>
    <div class="controls" role="group" aria-label="Animation controls">
      <button id="play" type="button" aria-label="Pause animation" title="Pause (Space)">
        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
      </button>
      <button id="reset" type="button" aria-label="Reset animation" title="Reset (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="-2" max="4" step="0.25" value="0" aria-label="Animation speed">
      <output id="speed-value" for="speed">1×</output>
    </div>
    <noscript>Enable JavaScript to watch the prime orbits.</noscript>
  </main>
</body>
</html>
